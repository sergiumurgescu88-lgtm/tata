  <head>

    <link rel="canonical" href="https://www.smartrenowable.energy/" />
    <meta name="description" content="Partener tehnic pentru proiecte bancabile de energie regenerabilă. Due Diligence, Studii de Fezabilitate și Diagnostic Avansat." />
    <meta name="google-site-verification" content="google349bf57f9438e5e4" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              smart: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                950: '#082f49',
              },
              energy: {
                green: '#16a34a',
                dark: '#0f172a',
                navy: '#121d2f'
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <script>
      // 1. Process Polyfill (Critical for Gemini SDK)
      window.process = window.process || { env: {} };

      // 2. Global Error Handler
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Critical Error:", message, error);
        var root = document.getElementById('root');
        if (root && (root.innerText.includes("Loading application") || root.innerHTML === "")) {
          root.innerHTML = `
            <div style="padding: 2rem; color: #ef4444; font-family: sans-serif; max-width: 800px; margin: 0 auto; text-align: center;">
              <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Startup Error</h2>
              <div style="background: #fef2f2; padding: 1rem; border-radius: 0.5rem; border: 1px solid #fee2e2; text-align: left;">
                <p style="font-weight: bold;">${message}</p>
                <p style="font-size: 0.875rem; margin-top: 0.5rem; color: #666;">${source}:${lineno}</p>
              </div>
              <button onclick="window.location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #0ea5e9; color: white; border-radius: 0.25rem; border: none; cursor: pointer;">Reload Application</button>
            </div>
          `;
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #ffffff; margin: 0; color: #0f172a; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      .hero-gradient {
        background: linear-gradient(105deg, #121d2f 0%, #1a2a44 100%);
      }
      .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
      .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "@google/genai": "https://esm.sh/@google/genai@0.12.0",
    "react-markdown": "https://esm.sh/react-markdown@9?deps=react@18.3.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>

</head>
  <body class="antialiased">
    <div id="root">
      <!-- Default Loading State -->
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #64748b; font-family: sans-serif;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #0ea5e9; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <p style="font-weight: 500;">Loading SMART Renowable Energy SRL...</p>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
